<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCR切り分けテスト // 枠内拡大＆コントラスト強調</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #eef3ff; padding: 14px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 18px; }
  p.sub { margin: 0 0 12px; font-size: 12.5px; color: #95a5c6; }
  .cam-box { position: relative; width: 100%; background: #050811; border-radius: 10px; overflow: hidden; border: 1px solid #26355c; }
  video { width: 100%; display: block; max-height: 360px; object-fit: cover; }
  /* 画面中央の読み取りガイド枠 */
  .guide {
    position: absolute;
    left: 6%; right: 6%; top: 28%; height: 44%;
    border: 2px solid #38bdf8;
    box-shadow: 0 0 0 9999px rgba(5, 8, 17, 0.55);
    border-radius: 6px;
    pointer-events: none;
  }
  .guide-label {
    position: absolute; top: -22px; left: 0;
    background: #38bdf8; color: #050811; font-size: 11px; font-weight: 700;
    padding: 1px 6px; border-radius: 4px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button {
    background: #1d3557; color: #fff; border: 1px solid #38bdf8;
    border-radius: 7px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  button.ok { border-color: #22c55e; background: rgba(34,197,94,0.18); color: #86efac; }
  .panel { background: #131c33; border: 1px solid #26355c; border-radius: 10px; padding: 12px; margin-top: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 13.5px; color: #38bdf8; }
  canvas.crop-view { width: 100%; max-height: 160px; object-fit: contain; background: #000; border-radius: 6px; border: 1px solid #26355c; }
  textarea { width: 100%; min-height: 90px; background: #080c17; color: #eef3ff; border: 1px solid #26355c; border-radius: 6px; padding: 8px; font-size: 14px; margin-top: 6px; }
  .log { font-family: ui-monospace, monospace; font-size: 11.5px; color: #95a5c6; margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OCR切り分けテスト（枠内拡大＆強調）</h1>
  <p class="sub">水色の枠に宛名を入れて「今すぐ枠内OCR」を押してください。切り抜いた画像と認識結果を表示します。</p>

  <div class="cam-box">
    <video id="video" playsinline muted></video>
    <div class="guide"><span class="guide-label">ここに宛名を入れる</span></div>
  </div>

  <div class="row">
    <button id="startBtn">1. カメラ起動</button>
    <button id="ocrBtn" class="ok">2. 今すぐ枠内OCR</button>
    <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#cbd5e1;">
      <input type="checkbox" id="highContrast" checked> コントラスト強調
    </label>
  </div>

  <div class="panel">
    <h2>OCRに渡した切り抜き画像（確認用）</h2>
    <canvas id="cropCanvas" class="crop-view"></canvas>
    <h2 style="margin-top:10px;">認識結果</h2>
    <textarea id="resultText" placeholder="ここに認識された文字が出ます"></textarea>
    <div class="log" id="log">待機中</div>
  </div>
</div>

<script>
let worker = null;
let busy = false;

function setLog(msg) {
  document.getElementById("log").textContent = msg;
}

async function ensureWorker() {
  if (!worker) {
    setLog("日本語OCRエンジンを読み込み中（初回は数秒〜十数秒かかります）...");
    worker = await Tesseract.createWorker("jpn", 1, {
      logger: m => {
        if (m.status === "recognizing text") {
          setLog(`認識中... ${Math.round((m.progress || 0) * 100)}%`);
        }
      }
    });
    // 単一行〜ブロック混在向けの設定
    await worker.setParameters({ tessedit_pageseg_mode: Tesseract.PSM.AUTO });
  }
  return worker;
}

document.getElementById("startBtn").addEventListener("click", async () => {
  try {
    setLog("カメラを起動中...");
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        focusMode: { ideal: "continuous" }
      },
      audio: false
    });
    const video = document.getElementById("video");
    video.srcObject = stream;
    await video.play();
    setLog(`カメラ起動OK（解像度: ${video.videoWidth}x${video.videoHeight}）`);
  } catch (e) {
    setLog("カメラ起動エラー: " + (e?.message || e));
  }
});

document.getElementById("ocrBtn").addEventListener("click", async () => {
  if (busy) return;
  const video = document.getElementById("video");
  if (!video.srcObject || video.readyState < 2) {
    setLog("先に「1. カメラ起動」を押してください");
    return;
  }
  busy = true;
  try {
    const w = video.videoWidth || 1280;
    const h = video.videoHeight || 720;

    // ガイド枠（left: 6%, width: 88%, top: 28%, height: 44%）に対応する領域を切り抜き、横幅1200pxに拡大
    const sx = Math.round(w * 0.06);
    const sy = Math.round(h * 0.28);
    const sw = Math.round(w * 0.88);
    const sh = Math.round(h * 0.44);

    const outW = 1200;
    const outH = Math.max(200, Math.round((sh / sw) * outW));

    const canvas = document.getElementById("cropCanvas");
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, outW, outH);

    // グレースケール＋コントラスト強調
    if (document.getElementById("highContrast").checked) {
      const img = ctx.getImageData(0, 0, outW, outH);
      const d = img.data;
      const contrast = 1.6; // 1.0が標準
      const intercept = 128 * (1 - contrast);
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = Math.max(0, Math.min(255, gray * contrast + intercept));
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(img, 0, 0);
    }

    const wk = await ensureWorker();
    const { data } = await wk.recognize(canvas);
    const text = String(data?.text || "").trim();
    document.getElementById("resultText").value = text;
    setLog(text ? `認識完了（${text.replace(/\n+/g, " ").length}文字）` : "文字が検出されませんでした。枠内の文字サイズや明るさを調整してください。");
  } catch (e) {
    setLog("OCRエラー: " + (e?.message || e));
  } finally {
    busy = false;
  }
});
</script>
</body>
</html>
