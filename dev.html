<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>徒歩配達ルート最適化 v0.2.2 // 住所抽出緩和版</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #131c33;
    --border: #26355c;
    --text: #eef3ff;
    --muted: #95a5c6;
    --accent: #38bdf8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 14px; }
  h1 { margin: 0 0 4px; font-size: 19px; }
  .sub { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .grid .card { margin-bottom: 0; }
  .card h2 {
    margin: 0 0 10px;
    font-size: 15px;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  video {
    width: 100%;
    max-height: 260px;
    background: #050811;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
    object-fit: cover;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    background: #080c17;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    resize: vertical;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button {
    background: #1d3557;
    color: #fff;
    border: 1px solid var(--accent);
    border-radius: 7px;
    padding: 8px 13px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #254673; }
  button.ok { border-color: var(--ok); background: rgba(34, 197, 94, 0.16); color: #86efac; }
  button.warn { border-color: var(--warn); background: rgba(245, 158, 11, 0.16); color: #fcd34d; }
  button.err { border-color: var(--err); background: rgba(239, 68, 68, 0.16); color: #fca5a5; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .b-exact { background: rgba(34,197,94,0.2); color: #86efac; }
  .b-town { background: rgba(245,158,11,0.2); color: #fcd34d; }
  .b-fail { background: rgba(239,68,68,0.2); color: #fca5a5; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  th, td { border-bottom: 1px solid rgba(148,163,184,0.15); padding: 7px 6px; text-align: left; }
  th { color: var(--muted); font-size: 11px; }
  .log {
    font-family: ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted);
    max-height: 120px;
    overflow-y: auto;
    background: #080c17;
    padding: 8px;
    border-radius: 6px;
    margin-top: 10px;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>徒歩配達ルート最適化 v0.2.2 — 住所抽出緩和版</h1>
  <p class="sub">貼り付けテキストの抽出条件を緩め、氏名・住所・郵便番号を座標変換後に破棄するプロトタイプです。</p>

  <div class="grid">
    <div class="card">
      <h2><span>1. カメラプレビュー</span><span id="camBadge" class="badge b-town">停止中</span></h2>
      <video id="camPreview" playsinline muted></video>
      <div class="row">
        <button id="camStartBtn" class="ok">カメラ起動</button>
        <button id="camStopBtn" class="err">カメラ停止</button>
      </div>
      <div class="hint">※ HTTPS（GitHub Pages等）とブラウザのカメラ許可が必要です。</div>
    </div>

    <div class="card">
      <h2><span>2. 宛名テキスト取り込み</span><span class="badge b-exact">コスト0円</span></h2>
      <textarea id="pasteInput" placeholder="OS標準のカメラ文字認識でコピーした宛名を貼り付け&#10;例: 〒190-0023 東京都立川市柴崎町3-1-1 山田太郎&#10;例: 柴崎町3-1-1"></textarea>
      <div class="row">
        <button id="ingestBtn" class="ok">取り込み＆座標変換</button>
        <button id="pasteClipBtn">クリップボード貼付</button>
        <button id="sampleBtn">サンプル5件</button>
        <button id="resetBtn" class="err">全初期化</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2><span>動作ログ</span></h2>
    <div class="log" id="sysLog" style="margin-top:0;">待機中</div>
  </div>

  <div class="card">
    <h2><span>3. 要確認リスト（町丁目止まり・特定不能）</span><span id="reviewCount" class="badge b-warn">0件</span></h2>
    <table>
      <thead>
        <tr>
          <th>配達番号</th>
          <th>精度</th>
          <th>判定メモ</th>
          <th>緯度 / 経度</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="reviewBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2><span>4. 確定済み配達データ（氏名・住所・郵便番号 削除済み）</span><span id="confirmedCount" class="badge b-exact">0件</span></h2>
    <table>
      <thead>
        <tr>
          <th>配達番号</th>
          <th>順序</th>
          <th>状況</th>
          <th>精度</th>
          <th>緯度</th>
          <th>経度</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="confirmedBody"></tbody>
    </table>
  </div>
</div>

<script>
let deliveries = [];
let seqCounter = 0;
let audioCtx = null;
let camStream = null;
const tempReviewMeta = new Map();

function logMsg(msg) {
  const el = document.getElementById("sysLog");
  const t = new Date().toLocaleTimeString("ja-JP", { hour12: false });
  el.innerHTML = `[${t}] ${escapeHtml(msg)}<br>` + el.innerHTML;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function nextDeliveryId() {
  seqCounter += 1;
  return `配達番号${String(seqCounter).padStart(3, "0")}`;
}

function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  } catch (_) {}
}

function setCamBadge(active, label) {
  const badge = document.getElementById("camBadge");
  badge.textContent = label;
  badge.className = active ? "badge b-exact" : "badge b-town";
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setCamBadge(false, "非対応環境");
    logMsg("このブラウザでは getUserMedia に非対応です");
    return;
  }
  try {
    if (camStream) {
      camStream.getTracks().forEach(t => t.stop());
      camStream = null;
    }
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });
    const video = document.getElementById("camPreview");
    video.srcObject = camStream;
    await video.play();
    setCamBadge(true, "起動中");
    logMsg("カメラを起動しました");
  } catch (e) {
    setCamBadge(false, "起動失敗");
    logMsg(`カメラ起動エラー: ${e?.name || ""} ${e?.message || e}`);
  }
}

function stopCamera() {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
  const video = document.getElementById("camPreview");
  video.srcObject = null;
  setCamBadge(false, "停止中");
  logMsg("カメラを停止しました");
}

// 全角数字・全角ハイフンを半角に寄せる
function normalizeDigitsAndHyphens(s) {
  return String(s || "")
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[‐−ー－―〜～]/g, "-");
}

// 貼り付けテキストから住所候補を抽出（捨てすぎない緩和版）
function parseAddressEntries(rawText) {
  const lines = String(rawText || "")
    .split(/\r?\n/)
    .map(l => normalizeDigitsAndHyphens(l).replace(/\u3000/g, " ").replace(/\s+/g, " ").trim())
    .filter(Boolean);

  const entries = [];
  for (const line of lines) {
    // 郵便番号記号や郵便番号（3桁-4桁または7桁）を除去
    let candidate = line
      .replace(/[〒\u3012]/g, " ")
      .replace(/\b\d{3}-?\d{4}\b/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    if (!candidate) continue;

    // 末尾に「様」「御中」があればその手前まで（ただし全体が氏名だけなら残す）
    const honorificMatch = candidate.match(/^(.*?)\s*[^\s]{1,8}(様|御中)$/);
    if (honorificMatch && honorificMatch[1].trim().length >= 2) {
      candidate = honorificMatch[1].trim();
    }

    // 「都・道・府・県・市・区・町・村・丁目・番地・号・数字-数字」または「2文字以上の文字列」があれば候補にする
    if (candidate.length >= 2) {
      entries.push(candidate);
    }
  }
  return entries;
}

async function geocodeJapaneseAddress(address) {
  if (!address) return { ok: false, accuracy: "UNKNOWN", reason: "住所が空です" };
  try {
    const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(address)}`;
    const res = await fetch(url);
    if (!res.ok) return { ok: false, accuracy: "UNKNOWN", reason: `API応答エラー(${res.status})` };
    const list = await res.json();
    if (!Array.isArray(list) || list.length === 0) {
      return { ok: false, accuracy: "UNKNOWN", reason: `該当なし: ${address.slice(0, 18)}` };
    }
    const top = list[0];
    const [lng, lat] = top.geometry?.coordinates || [];
    const title = String(top.properties?.title || "");
    if (typeof lat !== "number" || typeof lng !== "number") {
      return { ok: false, accuracy: "UNKNOWN", reason: "座標が取得できません" };
    }

    const hasBlockInInput = /(\d+丁目|\d+-\d+|\d+番地|\d+号)/.test(address);
    const hasBlockInResult = /(\d+丁目|\d+-\d+|\d+番地|\d+号)/.test(title);
    if (hasBlockInInput && hasBlockInResult) {
      return { ok: true, lat, lng, accuracy: "EXACT", reason: "番地レベルまで特定" };
    }
    return { ok: true, lat, lng, accuracy: "TOWN", reason: "町丁目レベルまで特定（番地要確認）" };
  } catch (_) {
    return { ok: false, accuracy: "UNKNOWN", reason: "通信または変換エラー" };
  }
}

async function processRawInput(rawText) {
  const entries = parseAddressEntries(rawText);
  if (entries.length === 0) {
    logMsg("空行のみで取り込める文字がありませんでした");
    return;
  }

  logMsg(`${entries.length}件の候補を処理中...`);
  for (const addr of entries) {
    const geo = await geocodeJapaneseAddress(addr);
    const id = nextDeliveryId();
    const needsReview = !geo.ok || geo.accuracy !== "EXACT";

    const record = {
      id,
      lat: geo.ok ? geo.lat : null,
      lng: geo.ok ? geo.lng : null,
      orderSeq: deliveries.length + 1,
      status: "PENDING",
      accuracy: geo.accuracy,
      needsReview
    };

    if (needsReview) {
      tempReviewMeta.set(id, { reason: geo.reason });
    }
    deliveries.push(record);
    logMsg(`${id} → ${geo.accuracy} (${geo.reason})`);
  }

  document.getElementById("pasteInput").value = "";
  playBeep();
  renderTables();
}

function confirmReviewItem(id) {
  const item = deliveries.find(d => d.id === id);
  if (!item) return;
  if (item.lat == null || item.lng == null) {
    item.lat = 35.698262;
    item.lng = 139.413699;
    item.accuracy = "TOWN";
  }
  item.needsReview = false;
  tempReviewMeta.delete(id);
  logMsg(`${id} を確定リストへ移動しました`);
  renderTables();
}

function deleteDelivery(id) {
  deliveries = deliveries.filter(d => d.id !== id);
  tempReviewMeta.delete(id);
  logMsg(`${id} を削除しました`);
  renderTables();
}

function toggleDelivered(id) {
  const item = deliveries.find(d => d.id === id);
  if (!item) return;
  item.status = item.status === "DELIVERED" ? "PENDING" : "DELIVERED";
  renderTables();
}

function renderTables() {
  const reviewItems = deliveries.filter(d => d.needsReview);
  const confirmedItems = deliveries.filter(d => !d.needsReview);

  document.getElementById("reviewCount").textContent = `${reviewItems.length}件`;
  document.getElementById("confirmedCount").textContent = `${confirmedItems.length}件`;

  document.getElementById("reviewBody").innerHTML = reviewItems.length
    ? reviewItems.map(d => {
        const meta = tempReviewMeta.get(d.id) || { reason: "要確認" };
        const badgeClass = d.accuracy === "TOWN" ? "b-town" : "b-fail";
        return `
          <tr>
            <td><strong>${escapeHtml(d.id)}</strong></td>
            <td><span class="badge ${badgeClass}">${escapeHtml(d.accuracy)}</span></td>
            <td>${escapeHtml(meta.reason)}</td>
            <td>${d.lat != null ? `${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}` : "未取得"}</td>
            <td>
              <button class="ok" onclick="confirmReviewItem('${d.id}')">確定</button>
              <button class="err" onclick="deleteDelivery('${d.id}')">削除</button>
            </td>
          </tr>`;
      }).join("")
    : `<tr><td colspan="5" style="color:var(--muted)">要確認データはありません</td></tr>`;

  document.getElementById("confirmedBody").innerHTML = confirmedItems.length
    ? confirmedItems.map(d => `
        <tr>
          <td><strong>${escapeHtml(d.id)}</strong></td>
          <td>#${d.orderSeq}</td>
          <td>${d.status === "DELIVERED" ? '<span class="badge b-exact">配達済</span>' : '<span class="badge b-town">未配達</span>'}</td>
          <td>${escapeHtml(d.accuracy)}</td>
          <td>${d.lat != null ? d.lat.toFixed(6) : "-"}</td>
          <td>${d.lng != null ? d.lng.toFixed(6) : "-"}</td>
          <td>
            <button onclick="toggleDelivered('${d.id}')">状況切替</button>
            <button class="err" onclick="deleteDelivery('${d.id}')">削除</button>
          </td>
        </tr>`).join("")
    : `<tr><td colspan="7" style="color:var(--muted)">確定済みデータはありません</td></tr>`;
}

document.getElementById("camStartBtn").addEventListener("click", startCamera);
document.getElementById("camStopBtn").addEventListener("click", stopCamera);

document.getElementById("ingestBtn").addEventListener("click", async () => {
  const val = document.getElementById("pasteInput").value;
  await processRawInput(val);
});

document.getElementById("pasteClipBtn").addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      document.getElementById("pasteInput").value = text;
      await processRawInput(text);
    } else {
      logMsg("クリップボードが空です");
    }
  } catch (_) {
    logMsg("クリップボードの直接読み取りが許可されていません。テキスト欄へ長押し貼り付けしてください。");
  }
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  document.getElementById("pasteInput").value = [
    "〒190-0023 東京都立川市柴崎町3-1-1 山田太郎",
    "〒190-0012 東京都立川市曙町2-1-1 佐藤花子",
    "東京都立川市錦町1丁目 鈴木一郎",
    "〒190-0023 東京都立川市柴崎町3-1-1 田中次郎",
    "架空の住所 99-99 高橋三郎"
  ].join("\n");
});

document.getElementById("resetBtn").addEventListener("click", () => {
  deliveries = [];
  seqCounter = 0;
  tempReviewMeta.clear();
  document.getElementById("pasteInput").value = "";
  renderTables();
  logMsg("全データを初期化しました");
});

renderTables();
logMsg("v0.2.2 準備完了");
</script>
</body>
</html>
