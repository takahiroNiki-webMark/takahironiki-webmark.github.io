<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>徒歩配達ルート v0.3 // 印字住所→GMAP即検索＆登録</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #131c33;
    --border: #26355c;
    --text: #eef3ff;
    --muted: #95a5c6;
    --accent: #38bdf8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 14px; }
  h1 { margin: 0 0 4px; font-size: 19px; }
  .sub { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 15px;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  input[type="text"], textarea {
    width: 100%;
    background: #080c17;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
  }
  textarea { min-height: 76px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button, a.btn-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    background: #1d3557;
    color: #fff;
    border: 1px solid var(--accent);
    border-radius: 7px;
    padding: 8px 13px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover, a.btn-link:hover { background: #254673; }
  button.ok, a.btn-link.ok { border-color: var(--ok); background: rgba(34, 197, 94, 0.16); color: #86efac; }
  button.warn { border-color: var(--warn); background: rgba(245, 158, 11, 0.16); color: #fcd34d; }
  button.err { border-color: var(--err); background: rgba(239, 68, 68, 0.16); color: #fca5a5; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .b-exact { background: rgba(34,197,94,0.2); color: #86efac; }
  .b-town { background: rgba(245,158,11,0.2); color: #fcd34d; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  th, td { border-bottom: 1px solid rgba(148,163,184,0.15); padding: 7px 6px; text-align: left; }
  th { color: var(--muted); font-size: 11px; }
  .log {
    font-family: ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted);
    max-height: 110px;
    overflow-y: auto;
    background: #080c17;
    padding: 8px;
    border-radius: 6px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>徒歩配達ルート v0.3 — 印字住所 → GMAP即検索＆登録</h1>
  <p class="sub">封筒1件の印字住所を貼り付けてGoogleマップで即確認し、登録後は住所・氏名・郵便番号を保持しません。</p>

  <div class="card">
    <h2><span>1. 印字住所の貼り付け・GMAP検索</span><span class="badge b-exact">1件ずつ最速</span></h2>
    <textarea id="rawInput" placeholder="OSカメラOCRでコピーした宛名を貼り付け（例: 〒190-0023 東京都立川市柴崎町3-1-1 山田太郎）"></textarea>
    <div class="row">
      <button id="cleanBtn" class="warn">住所だけ整形</button>
      <a id="gmapLink" class="btn-link ok" href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer">Googleマップで検索</a>
      <button id="registerBtn" class="ok">座標変換して登録（個人情報破棄）</button>
      <button id="sampleBtn">サンプル入力</button>
    </div>
    <div style="margin-top:10px;">
      <input type="text" id="cleanedAddress" placeholder="検索・登録に使う整形済み住所（必要ならここで微修正できます）">
    </div>
    <div class="log" id="sysLog">待機中</div>
  </div>

  <div class="card">
    <h2><span>2. 登録済み配達リスト（住所・氏名・郵便番号 未保持）</span><span id="listCount" class="badge b-exact">0件</span></h2>
    <table>
      <thead>
        <tr>
          <th>配達番号</th>
          <th>順序</th>
          <th>状況</th>
          <th>精度</th>
          <th>緯度</th>
          <th>経度</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
</div>

<script>
let deliveries = [];
let seqCounter = 0;

function logMsg(msg) {
  const el = document.getElementById("sysLog");
  const t = new Date().toLocaleTimeString("ja-JP", { hour12: false });
  el.innerHTML = `[${t}] ${escapeHtml(msg)}<br>` + el.innerHTML;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function normalizeDigitsAndHyphens(s) {
  return String(s || "")
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[‐−ー－―〜～]/g, "-");
}

function cleanAddressText(raw) {
  let s = normalizeDigitsAndHyphens(raw)
    .replace(/\r?\n+/g, " ")
    .replace(/[〒\u3012]/g, " ")
    .replace(/\b\d{3}-?\d{4}\b/g, " ")
    .replace(/\u3000/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  // 末尾の「〇〇様」「〇〇御中」を簡易除去
  s = s.replace(/\s+[^\s]{1,10}(様|御中)$/g, "").trim();
  return s;
}

function updateGmapLink() {
  const addr = document.getElementById("cleanedAddress").value.trim();
  const link = document.getElementById("gmapLink");
  if (!addr) {
    link.href = "https://www.google.com/maps";
    return;
  }
  link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;
}

async function geocodeAddress(address) {
  if (!address) return { ok: false, accuracy: "UNKNOWN" };
  try {
    const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(address)}`;
    const res = await fetch(url);
    if (!res.ok) return { ok: false, accuracy: "UNKNOWN" };
    const list = await res.json();
    if (!Array.isArray(list) || list.length === 0) return { ok: false, accuracy: "UNKNOWN" };
    const top = list[0];
    const [lng, lat] = top.geometry?.coordinates || [];
    const title = String(top.properties?.title || "");
    if (typeof lat !== "number" || typeof lng !== "number") return { ok: false, accuracy: "UNKNOWN" };

    const hasBlockInInput = /(\d+丁目|\d+-\d+|\d+番地|\d+号)/.test(address);
    const hasBlockInResult = /(\d+丁目|\d+-\d+|\d+番地|\d+号)/.test(title);
    return {
      ok: true,
      lat,
      lng,
      accuracy: (hasBlockInInput && hasBlockInResult) ? "EXACT" : "TOWN"
    };
  } catch (_) {
    return { ok: false, accuracy: "UNKNOWN" };
  }
}

function renderList() {
  document.getElementById("listCount").textContent = `${deliveries.length}件`;
  const tbody = document.getElementById("listBody");
  if (!deliveries.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="color:var(--muted)">まだ登録データはありません</td></tr>`;
    return;
  }
  tbody.innerHTML = deliveries.map(d => `
    <tr>
      <td><strong>${escapeHtml(d.id)}</strong></td>
      <td>#${d.orderSeq}</td>
      <td>${d.status === "DELIVERED" ? '<span class="badge b-exact">配達済</span>' : '<span class="badge b-town">未配達</span>'}</td>
      <td>${escapeHtml(d.accuracy)}</td>
      <td>${d.lat != null ? d.lat.toFixed(6) : "-"}</td>
      <td>${d.lng != null ? d.lng.toFixed(6) : "-"}</td>
      <td><button onclick="toggleStatus('${d.id}')">状況切替</button></td>
    </tr>
  `).join("");
}

function toggleStatus(id) {
  const item = deliveries.find(d => d.id === id);
  if (!item) return;
  item.status = item.status === "DELIVERED" ? "PENDING" : "DELIVERED";
  renderList();
}

document.getElementById("cleanBtn").addEventListener("click", () => {
  const raw = document.getElementById("rawInput").value;
  const cleaned = cleanAddressText(raw);
  document.getElementById("cleanedAddress").value = cleaned;
  updateGmapLink();
  logMsg(cleaned ? `整形完了: ${cleaned}` : "整形できる住所がありません");
});

document.getElementById("rawInput").addEventListener("input", e => {
  const cleaned = cleanAddressText(e.target.value);
  document.getElementById("cleanedAddress").value = cleaned;
  updateGmapLink();
});

document.getElementById("cleanedAddress").addEventListener("input", updateGmapLink);

document.getElementById("registerBtn").addEventListener("click", async () => {
  const addr = document.getElementById("cleanedAddress").value.trim() || cleanAddressText(document.getElementById("rawInput").value);
  if (!addr) {
    logMsg("登録する住所を入力または貼り付けてください");
    return;
  }
  const geo = await geocodeAddress(addr);
  seqCounter += 1;
  const id = `配達番号${String(seqCounter).padStart(3, "0")}`;

  // 住所・氏名・郵便番号はここで破棄し、保持対象のみ格納
  deliveries.push({
    id,
    lat: geo.ok ? geo.lat : null,
    lng: geo.ok ? geo.lng : null,
    orderSeq: deliveries.length + 1,
    status: "PENDING",
    accuracy: geo.accuracy
  });

  document.getElementById("rawInput").value = "";
  document.getElementById("cleanedAddress").value = "";
  updateGmapLink();
  logMsg(`${id} を登録しました（精度: ${geo.accuracy} / 個人情報は未保持）`);
  renderList();
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  const sample = "〒190-0023 東京都立川市柴崎町3-1-1 山田太郎";
  document.getElementById("rawInput").value = sample;
  const cleaned = cleanAddressText(sample);
  document.getElementById("cleanedAddress").value = cleaned;
  updateGmapLink();
  logMsg("サンプル住所を入力しました");
});

renderList();
logMsg("v0.3 準備完了（貼り付け → GMAPで検索 → 登録）");
</script>
</body>
</html>
