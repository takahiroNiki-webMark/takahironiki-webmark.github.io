<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>徒歩配達ルート最適化 v0.2 // OS標準OCR貼り付け＆座標化</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #131c33;
    --border: #26355c;
    --text: #eef3ff;
    --muted: #95a5c6;
    --accent: #38bdf8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 14px; }
  h1 { margin: 0 0 4px; font-size: 19px; }
  .sub { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 15px;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    background: #080c17;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    resize: vertical;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button {
    background: #1d3557;
    color: #fff;
    border: 1px solid var(--accent);
    border-radius: 7px;
    padding: 8px 13px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #254673; }
  button.ok { border-color: var(--ok); background: rgba(34, 197, 94, 0.16); color: #86efac; }
  button.warn { border-color: var(--warn); background: rgba(245, 158, 11, 0.16); color: #fcd34d; }
  button.err { border-color: var(--err); background: rgba(239, 68, 68, 0.16); color: #fca5a5; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .b-exact { background: rgba(34,197,94,0.2); color: #86efac; }
  .b-town { background: rgba(245,158,11,0.2); color: #fcd34d; }
  .b-fail { background: rgba(239,68,68,0.2); color: #fca5a5; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  th, td { border-bottom: 1px solid rgba(148,163,184,0.15); padding: 7px 6px; text-align: left; }
  th { color: var(--muted); font-size: 11px; }
  .log {
    font-family: ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted);
    max-height: 110px;
    overflow-y: auto;
    background: #080c17;
    padding: 8px;
    border-radius: 6px;
    margin-top: 10px;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>徒歩配達ルート最適化 v0.2 — OS標準OCR貼り付け＆座標化</h1>
  <p class="sub">スマホのカメラ文字認識でコピーした宛名を貼り付けると、緯度・経度へ変換し、氏名・住所・郵便番号を破棄します。</p>

  <div class="card">
    <h2><span>1. 宛名テキストの貼り付け・取り込み</span><span class="badge b-exact">コスト0円・OCR軽量化</span></h2>
    <textarea id="pasteInput" placeholder="ここにOSカメラOCRでコピーした宛名を貼り付け（1行1件、複数行まとめてもOK）&#10;例: 〒190-0023 東京都立川市柴崎町3-1-1 山田太郎"></textarea>
    <div class="hint">※「宛名と氏名が2行に分かれている場合」も、次の行が数字や番地ではなく氏名らしき行であれば自動で住所側にまとめます。</div>
    <div class="row">
      <button id="ingestBtn" class="ok">取り込み＆座標変換（個人情報破棄）</button>
      <button id="pasteClipBtn">クリップボードから貼り付け</button>
      <button id="sampleBtn">サンプル5件を入力</button>
      <button id="resetBtn" class="err">全データ初期化</button>
    </div>
    <div class="log" id="sysLog">待機中</div>
  </div>

  <div class="card">
    <h2><span>2. 要確認リスト（町丁目止まり・特定不能）</span><span id="reviewCount" class="badge b-warn">0件</span></h2>
    <table>
      <thead>
        <tr>
          <th>配達番号</th>
          <th>精度</th>
          <th>判定メモ</th>
          <th>緯度 / 経度</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="reviewBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2><span>3. 確定済み配達データ（氏名・住所・郵便番号 削除済み）</span><span id="confirmedCount" class="badge b-exact">0件</span></h2>
    <table>
      <thead>
        <tr>
          <th>配達番号</th>
          <th>順序</th>
          <th>状況</th>
          <th>精度</th>
          <th>緯度</th>
          <th>経度</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="confirmedBody"></tbody>
    </table>
  </div>
</div>

<script>
// 保持対象（個人情報を含まない配達モデル）
let deliveries = [];
let seqCounter = 0;
let audioCtx = null;
// 確認リスト表示中の一時メモ（確定または削除時に破棄）
const tempReviewMeta = new Map();

function logMsg(msg) {
  const el = document.getElementById("sysLog");
  const t = new Date().toLocaleTimeString("ja-JP", { hour12: false });
  el.innerHTML = `[${t}] ${escapeHtml(msg)}<br>` + el.innerHTML;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function nextDeliveryId() {
  seqCounter += 1;
  return `配達番号${String(seqCounter).padStart(3, "0")}`;
}

function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
  } catch (_) {}
}

// 複数行テキストを「1件＝1配達」にまとめる簡易パーサ
function parseAddressEntries(rawText) {
  const lines = String(rawText || "")
    .split(/\r?\n/)
    .map(l => l.trim())
    .filter(Boolean);

  const entries = [];
  for (const line of lines) {
    // 郵便番号や「様/御中」を除いた形
    const stripped = line
      .replace(/[〒\u3012]/g, " ")
      .replace(/\d{3}-?\d{4}/g, " ")
      .replace(/\s+/g, " ")
      .trim();
    if (!stripped) continue;

    // すでに直前の行に住所があり、今の行が番地数字を含まず短い場合は「氏名行」とみなしてスキップ（別件扱いしたい場合は1行に書くか空行で分ける）
    const hasAddressToken = /(都|道|府|県|市|区|町|村|丁目|番地|号|\d+[-−ー]\d+)/.test(stripped);
    if (!hasAddressToken && entries.length > 0 && stripped.length <= 8) {
      continue;
    }

    // 同一行内の末尾に氏名らしき要素があれば除去
    const parts = stripped.split(" ");
    if (parts.length >= 2) {
      const last = parts[parts.length - 1];
      if (/(様|御中)$/.test(last) || (!/\d/.test(last) && last.length <= 6)) {
        parts.pop();
      }
    }
    const addressOnly = parts.join(" ").trim();
    if (addressOnly) entries.push(addressOnly);
  }
  return entries;
}

// 国土地理院 住所検索APIで座標変換＆精度判定
async function geocodeJapaneseAddress(address) {
  if (!address) return { ok: false, accuracy: "UNKNOWN", reason: "住所が空です" };
  try {
    const url = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(address)}`;
    const res = await fetch(url);
    if (!res.ok) return { ok: false, accuracy: "UNKNOWN", reason: `API応答エラー(${res.status})` };
    const list = await res.json();
    if (!Array.isArray(list) || list.length === 0) {
      return { ok: false, accuracy: "UNKNOWN", reason: "該当住所が見つかりません" };
    }
    const top = list[0];
    const [lng, lat] = top.geometry?.coordinates || [];
    const title = String(top.properties?.title || "");
    if (typeof lat !== "number" || typeof lng !== "number") {
      return { ok: false, accuracy: "UNKNOWN", reason: "座標が取得できません" };
    }

    const hasBlockInInput = /(\d+丁目|\d+[-−ー]\d+|\d+番地|\d+号)/.test(address);
    const hasBlockInResult = /(\d+丁目|\d+[-−ー]\d+|\d+番地|\d+号)/.test(title);
    if (hasBlockInInput && hasBlockInResult) {
      return { ok: true, lat, lng, accuracy: "EXACT", reason: "番地レベルまで特定" };
    }
    return { ok: true, lat, lng, accuracy: "TOWN", reason: "町丁目レベルまで特定（番地要確認）" };
  } catch (_) {
    return { ok: false, accuracy: "UNKNOWN", reason: "通信または変換エラー" };
  }
}

async function processRawInput(rawText) {
  const entries = parseAddressEntries(rawText);
  if (entries.length === 0) {
    logMsg("取り込める住所が見つかりませんでした");
    return;
  }

  for (const addr of entries) {
    const geo = await geocodeJapaneseAddress(addr);
    const id = nextDeliveryId();
    const needsReview = !geo.ok || geo.accuracy !== "EXACT";

    // 住所・氏名・郵便番号はここで破棄し、保持対象のみ格納
    const record = {
      id,
      lat: geo.ok ? geo.lat : null,
      lng: geo.ok ? geo.lng : null,
      orderSeq: deliveries.length + 1,
      status: "PENDING",
      accuracy: geo.accuracy,
      needsReview
    };

    if (needsReview) {
      tempReviewMeta.set(id, { reason: geo.reason });
    }
    deliveries.push(record);
    logMsg(`${id} を登録（精度: ${geo.accuracy} / 個人情報は未保持）`);
  }

  // 入力欄のテキストをクリアして破棄
  document.getElementById("pasteInput").value = "";
  playBeep();
  renderTables();
}

function confirmReviewItem(id) {
  const item = deliveries.find(d => d.id === id);
  if (!item) return;
  if (item.lat == null || item.lng == null) {
    item.lat = 35.698262;
    item.lng = 139.413699;
    item.accuracy = "TOWN";
  }
  item.needsReview = false;
  tempReviewMeta.delete(id);
